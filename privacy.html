<h1>プライバシーポリシー</h1>
<p>T2 は、持ち主ひとりが自分の Google ドライブのファイルを読み書きするためだけに使います。</p>
<p>ほかの人の情報は集めません。データを第三者に渡したり、売ったり、広告に使ったりしません。</p>
<p>ドライブのデータは持ち主の作業にだけ使い、外へ送りません。</p></body></html>
